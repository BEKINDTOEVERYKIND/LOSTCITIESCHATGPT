              assert summary['next_match_start'] == start + 65536
              assert summary['rounds'] == 3 and summary['max_scored_ply'] == 300
              assert summary['symmetries'] == 20 and f32(summary['temperature']) == f32(0.03)
              assert summary['base_alpha'] == 1.0
