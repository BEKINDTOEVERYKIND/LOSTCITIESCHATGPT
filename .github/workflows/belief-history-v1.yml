          b=json.load(open('base/summary.json')); build=json.load(open('runtime/bindings/build-identity.json'))
          exclusion_sha=sha('runtime/bindings/exact17/exclusions.txt')
          expected_starts=(0,65536,131072,196608)
          base_chain=[]
          previous_output=None
          previous_output_sha256=None
          previous_trained=previous_steps=previous_pending=0
          for index,start in enumerate(expected_starts,1):
              directory=Path('base' if index == 4 else f'base{index}')
              summary=json.loads((directory/'summary.json').read_text(encoding='ascii'))
              assert summary['schema'] == 'lc-history-belief-control-run-v1'
              assert summary['mode'] == 'train-control'
              assert summary['seed'] == 202706110102
              assert summary['matches'] == 65536
