name: Locked belief-history v1 accuracy campaign

# Inert until one future direct-child push adds only the bound execution file.
# This workflow measures opponent-hand posterior accuracy; it cannot replace or
# promote the maintained playing actor.
on:
  push:
    branches: [agent/correctness-and-policy-upgrade]
    paths: [data/experiments/locked_belief_history_v1_execution.json]

permissions:
  contents: read

concurrency:
  group: locked-belief-history-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN: data/experiments/locked_belief_history_v1_plan.json
  EXECUTION: data/experiments/locked_belief_history_v1_execution.json
  WORKFLOW: .github/workflows/belief-history-v1.yml
  HELPER: tools/belief_history_campaign.py
  REDUCER: tools/belief_history_reduce.py
  EXCLUSIONS: data/experiments/policy_cost_v7_exact17_exclusions.txt
  EXCLUSIONS_SHA256: 10034cf8b83aadf24fa0775e4dad2712573e1d84cbf364568ce6136682ac254c
  REQUIREMENTS: data/experiments/belief_history_v1_python_requirements.txt
  CFLAGS_LOCKED: -O3 -march=x86-64-v3 -funroll-loops -Wall -Wextra -std=c11 -fno-fast-math -ffp-contract=off
  LDFLAGS_LOCKED: -lm -pthread
  MKL_NUM_THREADS: '1'
  NPY_DISABLE_CPU_FEATURES: AVX512F
  OMP_NUM_THREADS: '1'
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      execution_sha256: ${{ steps.guard.outputs.execution_sha256 }}
      source_commit: ${{ steps.guard.outputs.source_commit }}
      source_tree: ${{ steps.guard.outputs.source_tree }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, path: campaign}
      - id: guard
        name: Enforce the unique direct-child execution addendum
        working-directory: campaign
        env:
          AFTER: ${{ github.event.after }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/agent/correctness-and-policy-upgrade
          test "$FORCED" = false
          test "$AFTER" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n1 HEAD | wc -w)" = 2
          SOURCE_COMMIT="$(git rev-parse HEAD^)"
          SOURCE_TREE="$(git rev-parse 'HEAD^^{tree}')"
          test "$BEFORE" = "$SOURCE_COMMIT"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t%s' "$EXECUTION")"
          test "$(git rev-list --all --count -- "$EXECUTION")" = 1
          ! git cat-file -e "HEAD^:$EXECUTION" 2>/dev/null
          SNAPSHOT="$(mktemp -d)"
          git archive "$SOURCE_COMMIT" | tar -x -C "$SNAPSHOT"
          mkdir -p "$SNAPSHOT/$(dirname "$EXECUTION")"
          cp "$EXECUTION" "$SNAPSHOT/$EXECUTION"
          python3 "$SNAPSHOT/$HELPER" guard-execution --root "$SNAPSHOT" \
            --execution "$SNAPSHOT/$EXECUTION" \
            --source-parent-commit "$SOURCE_COMMIT" \
            --source-parent-tree "$SOURCE_TREE"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "execution_sha256=$(sha256sum "$EXECUTION" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build and test the exact bound parent
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          test "$(gcc -dumpversion | cut -d. -f1)" = 13
          mkdir source python-wheel
          git -C campaign archive "${{ steps.guard.outputs.source_commit }}" | tar -x -C source
          test ! -e "source/$EXECUTION"
          python3 -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes --dest python-wheel \
            -r "source/$REQUIREMENTS"
          test "$(find python-wheel -maxdepth 1 -type f -name '*.whl' | wc -l)" = 1
          NUMPY_WHEEL=python-wheel/numpy-2.3.5-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
          test "$(sha256sum "$NUMPY_WHEEL" | cut -d' ' -f1)" = 0d8163f43acde9a73c2a33605353a4f1bc4798745a8b1d73183b28e5b435ae28
          test ! -e python-runtime; mkdir python-runtime
          python3 -m pip install --disable-pip-version-check --no-index \
            --no-deps --target python-runtime "$NUMPY_WHEEL"
          PY_RUNTIME="$PWD/python-runtime"
          export PYTHONNOUSERSITE=1 PYTHONPATH="$PY_RUNTIME"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          import numpy
          expected=Path('python-runtime').resolve()
          actual=Path(numpy.__file__).resolve()
          assert numpy.__version__ == '2.3.5'
          assert actual.is_relative_to(expected), (actual,expected)
          wheel=Path('python-wheel/numpy-2.3.5-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl')
          value={
            'schema':'lc-belief-history-python-dependency-proof-v1',
            'isolation':'PYTHONNOUSERSITE=1 plus isolated PYTHONPATH target',
            'numpy_version':numpy.__version__,
            'numpy_module_relative_path':actual.relative_to(expected).as_posix(),
            'numpy_module_sha256':hashlib.sha256(actual.read_bytes()).hexdigest(),
            'numpy_wheel_sha256':hashlib.sha256(wheel.read_bytes()).hexdigest(),
          }
          Path('python-dependency-proof.json').write_text(
            json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False)+'\n',encoding='ascii')
          PY
          cd source
          {
            make -j2 CC=gcc CFLAGS="$CFLAGS_LOCKED" LDFLAGS="$LDFLAGS_LOCKED" \
              bin/history_belief_train bin/test_history_belief_model \
              bin/test_history_belief_exclusion
            ./bin/test_history_belief_model
            ./bin/test_history_belief_exclusion
            python3 -m unittest tests.test_history_belief_train \
              tests.test_belief_history_reduce tests.test_belief_history_campaign
            python3 "$HELPER" validate-plan --root .
          } 2>&1 | tee ../native-structural-tests.log
      - name: Seal the source-free runtime and exercise it before production
        run: |
          set -euo pipefail
          mkdir -p runtime/{bin,tools,data,bindings/exact17,bindings/python}
          cp source/bin/history_belief_train runtime/bin/
          cp source/tools/belief_history_{campaign,reduce}.py runtime/tools/
          cp source/data/champion.bin runtime/data/
          cp "source/$PLAN" runtime/bindings/plan.json
          cp "source/$WORKFLOW" runtime/bindings/workflow.yml
          cp "source/$EXCLUSIONS" runtime/bindings/exact17/exclusions.txt
          cp "source/$REQUIREMENTS" runtime/bindings/python/requirements.txt
          cp python-wheel/*.whl runtime/bindings/python/
          cp campaign/$EXECUTION runtime/bindings/execution.json
          cp native-structural-tests.log runtime/bindings/
          cp python-dependency-proof.json runtime/bindings/
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('runtime')
          value={
            'schema':'lc-belief-history-build-identity-v1',
            'runner':'ubuntu-24.04','architecture':'x86_64',
            'compiler':'gcc','compiler_version':subprocess.check_output(
              ['gcc','-dumpfullversion','-dumpversion'],text=True).strip(),
            'python_version':subprocess.check_output(
              ['python3','--version'],text=True,stderr=subprocess.STDOUT).strip(),
            'python_dependency_contract':{
              'isolation':'PYTHONNOUSERSITE=1 plus isolated PYTHONPATH target',
              'numpy_version':'2.3.5',
              'numpy_wheel_sha256':'0d8163f43acde9a73c2a33605353a4f1bc4798745a8b1d73183b28e5b435ae28',
            },
            'cflags':'-O3 -march=x86-64-v3 -funroll-loops -Wall -Wextra -std=c11 -fno-fast-math -ffp-contract=off',
            'ldflags':'-lm -pthread',
            'binary_sha256':hashlib.sha256((root/'bin/history_belief_train').read_bytes()).hexdigest(),
            'native_structural_test_sha256':hashlib.sha256((root/'bindings/native-structural-tests.log').read_bytes()).hexdigest(),
            'python_dependency_proof_sha256':hashlib.sha256((root/'bindings/python-dependency-proof.json').read_bytes()).hexdigest(),
            'exact17_exclusions_sha256':hashlib.sha256((root/'bindings/exact17/exclusions.txt').read_bytes()).hexdigest(),
            'execution_sha256':hashlib.sha256((root/'bindings/execution.json').read_bytes()).hexdigest(),
            'numeric_environment':{
              'MKL_NUM_THREADS':'1','NPY_DISABLE_CPU_FEATURES':'AVX512F',
              'OMP_NUM_THREADS':'1','OPENBLAS_CORETYPE':'Haswell',
              'OPENBLAS_NUM_THREADS':'1','PYTHONHASHSEED':'0'},
          }
          (root/'bindings/build-identity.json').write_text(
            json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False)+'\n',encoding='ascii')
          PY
          (cd runtime && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp -a runtime smoke-runtime
          cd smoke-runtime
          chmod 0755 bin/history_belief_train
          EX=bindings/exact17/exclusions.txt
          /usr/bin/time -f '%e' -o ../history-seconds \
            ./bin/history_belief_train train --out ../smoke-history.bin \
              --actor-net data/champion.bin --base-net data/champion.bin \
              --matches 100 --rounds 3 --seed 202706290101 --match-start 0 \
              --max-ply 300 --symmetries 20 --temperature 0.03 \
              --base-alpha 1.0 --epochs 1 --lr 0.01 --l2 0.0000001 \
              --exclusions "$EX" --exclusions-sha256 "$EXCLUSIONS_SHA256" \
              > ../smoke-history-summary.json
          /usr/bin/time -f '%e' -o ../control-seconds \
            ./bin/history_belief_train train-control \
              --out ../smoke-control.bin --control-state-out ../smoke-control.state \
              --actor-net data/champion.bin --base-net data/champion.bin \
              --matches 100 --rounds 3 --seed 202706290101 --match-start 0 \
              --max-ply 300 --symmetries 20 --temperature 0.03 \
              --base-alpha 1.0 --epochs 1 --lr 0.00015 --l2 0.0000001 \
              --control-batch-states 256 \
              --exclusions "$EX" --exclusions-sha256 "$EXCLUSIONS_SHA256" \
              > ../smoke-control-summary.json
          python3 - <<'PY'
          import json,struct
          def f32(value): return struct.unpack('<f',struct.pack('<f',value))[0]
          h=json.load(open('../smoke-history-summary.json'))
          c=json.load(open('../smoke-control-summary.json'))
          assert h['source_manifest_sha256'] == c['source_manifest_sha256']
          assert h['base_alpha'] == c['base_alpha'] == 1.0
          assert f32(h['training_learning_rate']) == f32(0.01)
          assert f32(c['lr']) == f32(0.00015)
          assert f32(h['training_l2']) == f32(c['l2']) == f32(0.0000001)
          assert c['control_finalized'] is False and c['pending_batch_states'] > 0
          # This throughput-only control tail is deliberately unused; only
          # production base chunk 4 and the matched branch finalize a tail.
          hs=float(open('../history-seconds').read()); cs=float(open('../control-seconds').read())
          assert hs > 0 and cs > 0 and 100/hs >= 3.5 and 100/cs >= 3.5
          PY
          ./bin/history_belief_train eval --model ../smoke-history.bin \
            --actor-net data/champion.bin --incumbent-alpha 1.15 \
            --base-net data/champion.bin \
            --base-alpha 1.0 --matched-base-net ../smoke-control.bin \
            --matched-base-alpha 1.0 --matches 2 --rounds 3 \
            --seed 202706290102 --match-start 0 --max-ply 300 \
            --symmetries 20 --temperature 0.03 --match-jsonl ../smoke-eval.jsonl \
            --exclusions "$EX" --exclusions-sha256 "$EXCLUSIONS_SHA256" \
            > ../smoke-eval-summary.json
          test "$(wc -l < ../smoke-eval.jsonl)" = 2
          if ./bin/history_belief_train eval --model ../smoke-history.bin \
            --actor-net data/champion.bin --incumbent-alpha 1.15 \
            --base-net data/champion.bin \
            --base-alpha 1.0 --matched-base-net ../smoke-control.bin \
            --matched-base-alpha 1.0 --matches 2 --rounds 3 \
            --seed 202706290102 --match-start 0 --max-ply 300 \
            --symmetries 20 --temperature 0.03 --match-jsonl ../smoke-eval.jsonl \
            --exclusions "$EX" --exclusions-sha256 "$EXCLUSIONS_SHA256"; then
            echo 'native evaluator clobbered existing evidence' >&2; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: belief-history-v1-runtime
          path: runtime
          if-no-files-found: error
          retention-days: 30

  base_control_1:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - name: Fit exclusion-safe base head, range 0..65535
        run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1
          (cd runtime && sha256sum -c SHA256SUMS); chmod 0755 runtime/bin/history_belief_train
          mkdir out
          runtime/bin/history_belief_train train-control \
            --out out/control.bin --control-state-out out/control.state \
            --actor-net runtime/data/champion.bin --base-net runtime/data/champion.bin \
            --matches 65536 --rounds 3 --seed 202706110102 --match-start 0 \
            --max-ply 300 --symmetries 20 --temperature 0.03 --base-alpha 1.0 \
            --epochs 1 --lr 0.0001 --l2 0.0000001 \
            --control-batch-states 256 \
            --exclusions runtime/bindings/exact17/exclusions.txt \
            --exclusions-sha256 "$EXCLUSIONS_SHA256" > out/summary.json
          python3 runtime/tools/belief_history_campaign.py verify-head-control \
            --champion runtime/data/champion.bin --control out/control.bin \
            --proof out/byte-proof.json
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: belief-history-v1-base-control-1, path: out, if-no-files-found: error, retention-days: 30}

  base_control_2:
    needs: base_control_1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-base-control-1, path: previous}
      - run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1
          (cd runtime && sha256sum -c SHA256SUMS); (cd previous && sha256sum -c SHA256SUMS)
          chmod 0755 runtime/bin/history_belief_train; mkdir out
          runtime/bin/history_belief_train train-control --out out/control.bin \
            --control-state-out out/control.state --control-state-in previous/control.state \
            --actor-net runtime/data/champion.bin --base-net previous/control.bin \
            --matches 65536 --rounds 3 --seed 202706110102 --match-start 65536 \
            --max-ply 300 --symmetries 20 --temperature 0.03 --base-alpha 1.0 \
            --epochs 1 --lr 0.0001 --l2 0.0000001 \
            --control-batch-states 256 \
            --exclusions runtime/bindings/exact17/exclusions.txt \
            --exclusions-sha256 "$EXCLUSIONS_SHA256" > out/summary.json
          python3 runtime/tools/belief_history_campaign.py verify-head-control --champion runtime/data/champion.bin --control out/control.bin --proof out/byte-proof.json
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: belief-history-v1-base-control-2, path: out, if-no-files-found: error, retention-days: 30}

  base_control_3:
    needs: base_control_2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-base-control-2, path: previous}
      - run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1
          (cd runtime && sha256sum -c SHA256SUMS); (cd previous && sha256sum -c SHA256SUMS)
          chmod 0755 runtime/bin/history_belief_train; mkdir out
          runtime/bin/history_belief_train train-control --out out/control.bin \
            --control-state-out out/control.state --control-state-in previous/control.state \
            --actor-net runtime/data/champion.bin --base-net previous/control.bin \
            --matches 65536 --rounds 3 --seed 202706110102 --match-start 131072 \
            --max-ply 300 --symmetries 20 --temperature 0.03 --base-alpha 1.0 \
            --epochs 1 --lr 0.0001 --l2 0.0000001 \
            --control-batch-states 256 \
            --exclusions runtime/bindings/exact17/exclusions.txt \
            --exclusions-sha256 "$EXCLUSIONS_SHA256" > out/summary.json
          python3 runtime/tools/belief_history_campaign.py verify-head-control --champion runtime/data/champion.bin --control out/control.bin --proof out/byte-proof.json
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: belief-history-v1-base-control-3, path: out, if-no-files-found: error, retention-days: 30}

  base_control_4:
    needs: base_control_3
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-base-control-3, path: previous}
      - run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1
          (cd runtime && sha256sum -c SHA256SUMS); (cd previous && sha256sum -c SHA256SUMS)
          chmod 0755 runtime/bin/history_belief_train; mkdir out
          runtime/bin/history_belief_train train-control --out out/control.bin \
            --control-state-out out/control.state --control-state-in previous/control.state \
            --actor-net runtime/data/champion.bin --base-net previous/control.bin \
            --matches 65536 --rounds 3 --seed 202706110102 --match-start 196608 \
            --max-ply 300 --symmetries 20 --temperature 0.03 --base-alpha 1.0 \
            --epochs 1 --lr 0.0001 --l2 0.0000001 \
            --control-batch-states 256 --control-finalize \
            --exclusions runtime/bindings/exact17/exclusions.txt \
            --exclusions-sha256 "$EXCLUSIONS_SHA256" > out/summary.json
          python3 runtime/tools/belief_history_campaign.py verify-head-control --champion runtime/data/champion.bin --control out/control.bin --proof out/byte-proof.json
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: belief-history-v1-base-control-4, path: out, if-no-files-found: error, retention-days: 30}

  history_train:
    needs: base_control_4
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-base-control-4, path: base}
      - run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1
          (cd runtime && sha256sum -c SHA256SUMS); (cd base && sha256sum -c SHA256SUMS)
          chmod 0755 runtime/bin/history_belief_train; mkdir out
          runtime/bin/history_belief_train train --out out/history-model.bin \
            --actor-net runtime/data/champion.bin --base-net base/control.bin \
            --matches 65536 --rounds 3 --seed 202706100101 --match-start 0 \
            --max-ply 300 --symmetries 20 --temperature 0.03 --base-alpha 1.0 \
            --epochs 1 --lr 0.01 --l2 0.0000001 \
            --exclusions runtime/bindings/exact17/exclusions.txt \
            --exclusions-sha256 "$EXCLUSIONS_SHA256" > out/summary.json
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: belief-history-v1-history-model, path: out, if-no-files-found: error, retention-days: 30}

  matched_control_train:
    needs: base_control_4
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-base-control-4, path: base}
      - run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1
          (cd runtime && sha256sum -c SHA256SUMS); (cd base && sha256sum -c SHA256SUMS)
          chmod 0755 runtime/bin/history_belief_train; mkdir out
          runtime/bin/history_belief_train train-control --out out/matched-control.bin \
            --control-state-out out/matched-control.state \
            --actor-net runtime/data/champion.bin --base-net base/control.bin \
            --matches 65536 --rounds 3 --seed 202706100101 --match-start 0 \
            --max-ply 300 --symmetries 20 --temperature 0.03 --base-alpha 1.0 \
            --epochs 1 --lr 0.00015 --l2 0.0000001 \
            --control-batch-states 256 --control-finalize \
            --exclusions runtime/bindings/exact17/exclusions.txt \
            --exclusions-sha256 "$EXCLUSIONS_SHA256" > out/summary.json
          python3 runtime/tools/belief_history_campaign.py verify-head-control --champion runtime/data/champion.bin --control out/matched-control.bin --proof out/byte-proof.json
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: belief-history-v1-matched-control, path: out, if-no-files-found: error, retention-days: 30}

  training_freeze:
    needs: [history_train, matched_control_train]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-runtime, path: runtime}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: belief-history-v1-base-control-1, path: base1}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
