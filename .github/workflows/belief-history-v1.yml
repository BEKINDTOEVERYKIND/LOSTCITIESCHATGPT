              if index == 4: assert summary['pending_batch_states'] == 0
              assert summary['source_state_count'] > 0
              assert summary['trained_state_count'] - previous_trained == summary['source_state_count']
              available=previous_pending + summary['source_state_count']
              expected_step_delta=available // 256
              expected_pending=available % 256
              if index == 4 and expected_pending:
                  expected_step_delta += 1
                  expected_pending = 0
              assert summary['optimizer_steps'] - previous_steps == expected_step_delta
              assert summary['pending_batch_states'] == expected_pending
              assert summary['control_state_source_manifest_scope'] == 'current_invocation'
