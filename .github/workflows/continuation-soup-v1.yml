name: Locked continuation-soup-v1 actor panels

# Publishing this workflow or its model transport must not consume a test seed.
# A later, addendum-only commit launches exactly one bound campaign.
on:
  push:
    branches:
      - agent/correctness-and-policy-upgrade
    paths:
      - data/experiments/locked_continuation_soup_v1_distributed_execution.json

permissions:
  contents: read

env:
  EVAL_SOURCE: bd485857eda329b8df7fc2281f1aea83aac195d4
  PLAN_SHA: 5b34f3cac29f4f2e4a4acb713c8c979450a6a1226cf24ad13d91dd30460fc709
  CANDIDATE_EXECUTION_SHA: 2cd54b8357c359758c6b42a22677acd16675a345d1a99439e2c358f043417baa
  ACTOR_EXECUTION_SHA: da3dcdaae4f8e3a80b1d6d26874b1935e05b52299274261f6b893b7ec8d7f1ed
  ROLE_RESULT_SHA: 9ae1caa83b9a2ffef715a6c90c3987e386795a00cd92bd19f000f8d2ca1811fb
  ROOT_SHA: af2b2c237d21f5ec15acbcba2fde3e45864a6e44af4ddb1ff6f3756fd687f417
  SOUP_SHA: e88c97912165165f200e7e1ebe9705971916c93083fa0049d63aa6eeba1adb8d
  SOUP_SIZE: '2823748'
  ARENA_SHA: a65f73871e04ed0e21f2bc9920a235cbb5d29950b35bb91df37ae9dcc8801efa
  MERGER_SHA: 9cad23c9e6550ea36d7721acf8e64144a44058083ad4aeb5bb5613a3a79139fb
  GATE_SHA: 50ae52c66698d04cd4cc13af35c3d0eaed72e37bd76657dae12aa10f09dcc2ed
  SHARD_VALIDATOR_SHA: bca430a94af64180436c7fb60d29b2e86ec4b3567ab3aabb09984aabee054855
  CANDIDATE: 'rolloutu2:data/champion.bin:results/continuation-soup-v1/soup.bin:512:5:0.02:0:1:14:0:0:0:0:3.5:2:4:20:0:0:20:1:0:512:1:0:0:0:0:0:0:3:1:0:0:0:0:0:0:1'
  BASELINE: 'rolloutu2:data/champion.bin:data/champion.bin:512:5:0.02:0:1:14:0:0:0:0:3.5:2:4:20:0:0:20:1:0:512:1:0:0:0:0:0:0:3:1:0:0:0:0:0:0:1'
  SAFETY_PROVENANCE: 'soupv1_actor_plan5b34f3_exec2cd54b_role9ae1ca_sourcebd4858_rootaf2b2c_soupe88c97_arenaa65f73'
  FINAL_PROVENANCE: 'stage=continuation_soup_v1_final;plan=5b34f3cac29f4f2e4a4acb713c8c979450a6a1226cf24ad13d91dd30460fc709;candidate_execution=2cd54b8357c359758c6b42a22677acd16675a345d1a99439e2c358f043417baa;actor_execution=da3dcdaae4f8e3a80b1d6d26874b1935e05b52299274261f6b893b7ec8d7f1ed;role_result=9ae1caa83b9a2ffef715a6c90c3987e386795a00cd92bd19f000f8d2ca1811fb;source=bd485857eda329b8df7fc2281f1aea83aac195d4;arena=a65f73871e04ed0e21f2bc9920a235cbb5d29950b35bb91df37ae9dcc8801efa;root=af2b2c237d21f5ec15acbcba2fde3e45864a6e44af4ddb1ff6f3756fd687f417;soup=e88c97912165165f200e7e1ebe9705971916c93083fa0049d63aa6eeba1adb8d;threads=4'

jobs:
  build_evaluator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      run_final: ${{ steps.guard.outputs.run_final }}
      distributed_sha: ${{ steps.guard.outputs.distributed_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          path: campaign

      - name: Fail closed unless this is the one addendum-only launch commit
        id: guard
        working-directory: campaign
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/correctness-and-policy-upgrade
          ADDENDUM=data/experiments/locked_continuation_soup_v1_distributed_execution.json
          test -f "$ADDENDUM"
          PARENT="$(git rev-parse HEAD^)"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$ADDENDUM"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def reject_constant(token):
              raise ValueError(f"non-standard JSON constant {token}")

          def unique(items):
              out = {}
              for key, value in items:
                  if key in out:
                      raise ValueError(f"duplicate JSON key {key}")
                  out[key] = value
              return out

          path = Path("data/experiments/locked_continuation_soup_v1_distributed_execution.json")
          value = json.loads(path.read_text(encoding="utf-8"),
                             object_pairs_hook=unique,
                             parse_constant=reject_constant)
          parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True).strip()
          workflow = Path(".github/workflows/continuation-soup-v1.yml")
          workflow_sha = hashlib.sha256(workflow.read_bytes()).hexdigest()
          expected = {
              "schema_version": 1,
              "artifact_kind": "locked_continuation_soup_v1_distributed_execution",
              "status": "bound_before_distributed_actor_efficacy",
              "source_parent_commit": parent,
              "workflow": {
                  "path": str(workflow),
                  "sha256": workflow_sha,
              },
              "locked_inputs": {
                  "plan_sha256": os.environ["PLAN_SHA"],
                  "candidate_execution_sha256": os.environ["CANDIDATE_EXECUTION_SHA"],
                  "actor_execution_sha256": os.environ["ACTOR_EXECUTION_SHA"],
                  "role_result_sha256": os.environ["ROLE_RESULT_SHA"],
              },
              "evidence_tools": {
                  "merge_arena_sha256": os.environ["MERGER_SHA"],
                  "gate_actor_panel_sha256": os.environ["GATE_SHA"],
                  "validate_actor_shards_sha256": os.environ["SHARD_VALIDATOR_SHA"],
              },
              "transport": {
                  "path": "data/models/continuation_soup_v1.bin",
                  "sha256": os.environ["SOUP_SHA"],
                  "size_bytes": int(os.environ["SOUP_SIZE"]),
                  "runtime_path": "results/continuation-soup-v1/soup.bin",
              },
              "evaluator": {
                  "source_commit": os.environ["EVAL_SOURCE"],
                  "arena_sha256": os.environ["ARENA_SHA"],
                  "root_sha256": os.environ["ROOT_SHA"],
                  "compiler": "gcc (Ubuntu 13.3.0-6ubuntu2~24.04) 13.3.0",
                  "cflags": "-O3 -march=x86-64-v3 -ffast-math -funroll-loops -Wall -Wextra -std=c11",
                  "threads_per_shard": 4,
              },
              "actors": {
                  "candidate": os.environ["CANDIDATE"],
                  "baseline": os.environ["BASELINE"],
                  "safety_provenance": os.environ["SAFETY_PROVENANCE"],
                  "final_provenance": os.environ["FINAL_PROVENANCE"],
              },
              "safety": {
                  "pairs_per_orientation": 200,
                  "pairs_per_shard": 20,
                  "starts": list(range(0, 200, 20)),
                  "candidate_first_seed": "202608240301",
                  "baseline_first_seed": "202608240302",
                  "gate": "score>=0.5; margin>0; each orientation candidate score>=0.475; zero caps; exact validity",
              },
              "final": {
                  "execute_if_safety_passes": value.get("final", {}).get(
                      "execute_if_safety_passes"),
                  "pairs_per_orientation": 2500,
                  "pairs_per_shard": 100,
                  "starts": list(range(0, 2500, 100)),
                  "candidate_first_seed": "202608240401",
                  "baseline_first_seed": "202608240402",
                  "gate_z": 1.645,
                  "gate": "score-z*SE>0.5; margin-z*SE>0; each orientation candidate score>0.5; zero caps; exact validity",
              },
              "inspection_rule": "No efficacy is read until every immutable shard and sidecar in that panel validates and the reciprocal merge completes.",
              "results": None,
          }
          if type(expected["final"]["execute_if_safety_passes"]) is not bool:
              raise SystemExit("final execution choice must be boolean")
          if value != expected:
              raise SystemExit("distributed execution addendum does not exactly match the locked campaign")
          for artifact, expected_sha in (
              (Path("data/experiments/locked_continuation_soup_v1_plan.json"),
               os.environ["PLAN_SHA"]),
              (Path("data/experiments/locked_continuation_soup_v1_execution.json"),
               os.environ["CANDIDATE_EXECUTION_SHA"]),
              (Path("data/experiments/locked_continuation_soup_v1_actor_execution.json"),
               os.environ["ACTOR_EXECUTION_SHA"]),
              (Path("data/experiments/role_coherent_result.json"),
               os.environ["ROLE_RESULT_SHA"]),
              (Path("tools/merge_arena.py"), os.environ["MERGER_SHA"]),
              (Path("tools/gate_actor_panel.py"), os.environ["GATE_SHA"]),
              (Path("tools/validate_actor_shards.py"),
               os.environ["SHARD_VALIDATOR_SHA"]),
          ):
              if hashlib.sha256(artifact.read_bytes()).hexdigest() != expected_sha:
                  raise SystemExit(f"locked artifact mismatch: {artifact}")
          if not re.fullmatch(r"[0-9a-f]{40}", parent):
              raise SystemExit("noncanonical parent commit")
          PY
          DISTRIBUTED_SHA="$(sha256sum "$ADDENDUM" | cut -d' ' -f1)"
          RUN_FINAL="$(python3 -c 'import json; print(str(json.load(open("data/experiments/locked_continuation_soup_v1_distributed_execution.json"))["final"]["execute_if_safety_passes"]).lower())')"
          echo "distributed_sha=$DISTRIBUTED_SHA" >> "$GITHUB_OUTPUT"
          echo "run_final=$RUN_FINAL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVAL_SOURCE }}
          path: source

      - name: Build and bind one immutable evaluator artifact
        run: |
          set -euo pipefail
          test "$(stat -c %s campaign/data/models/continuation_soup_v1.bin)" = "$SOUP_SIZE"
          test "$(sha256sum campaign/data/models/continuation_soup_v1.bin | cut -d' ' -f1)" = "$SOUP_SHA"
          make -C source CC=gcc \
            CFLAGS='-O3 -march=x86-64-v3 -ffast-math -funroll-loops -Wall -Wextra -std=c11' \
            bin/arena data/champion.bin
          test "$(sha256sum source/bin/arena | cut -d' ' -f1)" = "$ARENA_SHA"
          test "$(sha256sum source/data/champion.bin | cut -d' ' -f1)" = "$ROOT_SHA"
          mkdir -p evaluator
          cp source/bin/arena evaluator/arena
          cp source/data/champion.bin evaluator/champion.bin
          cp campaign/data/models/continuation_soup_v1.bin evaluator/continuation_soup_v1.bin
          {
            echo "launch_commit=$GITHUB_SHA"
            echo "source_parent_commit=$(git -C campaign rev-parse HEAD^)"
            echo "distributed_execution_sha=${{ steps.guard.outputs.distributed_sha }}"
            echo "source=$EVAL_SOURCE"
            echo "plan=$PLAN_SHA"
            echo "candidate_execution=$CANDIDATE_EXECUTION_SHA"
            echo "actor_execution=$ACTOR_EXECUTION_SHA"
            echo "role_result=$ROLE_RESULT_SHA"
            echo "cflags=-O3 -march=x86-64-v3 -ffast-math -funroll-loops -Wall -Wextra -std=c11"
            gcc --version | head -1
            uname -a
            sha256sum evaluator/arena evaluator/champion.bin evaluator/continuation_soup_v1.bin
          } > evaluator/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: continuation-soup-v1-evaluator
          path: evaluator
          if-no-files-found: error
          retention-days: 30

  safety_evaluate:
    needs: build_evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        orientation: [candidate-first, baseline-first]
        start: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: continuation-soup-v1-evaluator
          path: evaluator

      - name: Run one immutable 20-pair safety shard
        env:
          ORIENTATION: ${{ matrix.orientation }}
          PAIR_START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          mkdir -p bin data results/continuation-soup-v1 raw
          cp evaluator/arena bin/arena
          cp evaluator/champion.bin data/champion.bin
          cp evaluator/continuation_soup_v1.bin results/continuation-soup-v1/soup.bin
          chmod +x bin/arena
          test "$(sha256sum bin/arena | cut -d' ' -f1)" = "$ARENA_SHA"
          test "$(sha256sum data/champion.bin | cut -d' ' -f1)" = "$ROOT_SHA"
          test "$(stat -c %s results/continuation-soup-v1/soup.bin)" = "$SOUP_SIZE"
          test "$(sha256sum results/continuation-soup-v1/soup.bin | cut -d' ' -f1)" = "$SOUP_SHA"
          if [ "$ORIENTATION" = candidate-first ]; then
            AGENT_A="$CANDIDATE"
            AGENT_B="$BASELINE"
            SEED=202608240301
          else
            AGENT_A="$BASELINE"
            AGENT_B="$CANDIDATE"
            SEED=202608240302
          fi
          OUT="raw/${ORIENTATION}-${PAIR_START}"
          /usr/bin/time \
            -f 'wall_s=%e user_s=%U sys_s=%S max_rss_kb=%M exit=%x' \
            -o "${OUT}.time" \
            ./bin/arena -a "$AGENT_A" -b "$AGENT_B" \
              -n 20 -t 4 -s "$SEED" -r 3 --pair-start "$PAIR_START" \
              --raw-pairs "${OUT}.jsonl" --raw-only \
              --provenance "$SAFETY_PROVENANCE"
          sha256sum "${OUT}.jsonl" > "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: continuation-soup-v1-safety-${{ matrix.orientation }}-${{ matrix.start }}
          path: raw
          if-no-files-found: error
          retention-days: 30

  safety_merge:
    needs: safety_evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      passed: ${{ steps.decision.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: continuation-soup-v1-safety-*
          path: downloads
          merge-multiple: true

      - name: Validate every safety shard before any efficacy merge
        run: |
          set -euo pipefail
          test "$(sha256sum tools/merge_arena.py | cut -d' ' -f1)" = "$MERGER_SHA"
          test "$(sha256sum tools/gate_actor_panel.py | cut -d' ' -f1)" = "$GATE_SHA"
          test "$(sha256sum tools/validate_actor_shards.py | cut -d' ' -f1)" = "$SHARD_VALIDATOR_SHA"
          mkdir -p merged
          python3 tools/validate_actor_shards.py \
            --directory downloads --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --provenance "$SAFETY_PROVENANCE" \
            --candidate-first-seed 202608240301 \
            --baseline-first-seed 202608240302 \
            --starts 0,20,40,60,80,100,120,140,160,180 \
            --pairs-per-shard 20 --rounds 3 \
            --output merged/structural-validation.json
          python3 tools/merge_arena.py block \
            --expect-start 0 --expect-pairs 200 \
            --output merged/candidate-first.json \
            downloads/candidate-first-*.jsonl
          python3 tools/merge_arena.py block \
            --expect-start 0 --expect-pairs 200 \
            --output merged/baseline-first.json \
            downloads/baseline-first-*.jsonl
          python3 tools/merge_arena.py reciprocal \
            --first merged/candidate-first.json \
            --second merged/baseline-first.json \
            --gate-z 1.645 --require-positive-margin \
            --output merged/reciprocal.json

      - name: Apply the separate locked safety gate
        id: decision
        run: |
          set -euo pipefail
          python3 tools/gate_actor_panel.py \
            --reciprocal merged/reciprocal.json --mode safety \
            --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --provenance "$SAFETY_PROVENANCE" \
            --pairs-per-orientation 200 \
            --candidate-first-seed 202608240301 \
            --baseline-first-seed 202608240302 \
            --gate-z 1.645 --output merged/safety-decision.json \
            --github-output "$GITHUB_OUTPUT"
          find downloads merged -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
            xargs -0 sha256sum > merged/SHA256SUMS.txt
          sha256sum -c merged/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: continuation-soup-v1-safety-final-evidence
          path: |
            downloads
            merged
          if-no-files-found: error
          retention-days: 30

  final_evaluate:
    needs: [build_evaluator, safety_merge]
    if: ${{ needs.safety_merge.outputs.passed == 'true' && needs.build_evaluator.outputs.run_final == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        orientation: [candidate-first, baseline-first]
        start: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: continuation-soup-v1-evaluator
          path: evaluator

      - name: Run one immutable 100-pair final shard
        env:
          ORIENTATION: ${{ matrix.orientation }}
          PAIR_START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          mkdir -p bin data results/continuation-soup-v1 raw
          cp evaluator/arena bin/arena
          cp evaluator/champion.bin data/champion.bin
          cp evaluator/continuation_soup_v1.bin results/continuation-soup-v1/soup.bin
          chmod +x bin/arena
          test "$(sha256sum bin/arena | cut -d' ' -f1)" = "$ARENA_SHA"
          test "$(sha256sum data/champion.bin | cut -d' ' -f1)" = "$ROOT_SHA"
          test "$(stat -c %s results/continuation-soup-v1/soup.bin)" = "$SOUP_SIZE"
          test "$(sha256sum results/continuation-soup-v1/soup.bin | cut -d' ' -f1)" = "$SOUP_SHA"
          if [ "$ORIENTATION" = candidate-first ]; then
            AGENT_A="$CANDIDATE"
            AGENT_B="$BASELINE"
            SEED=202608240401
          else
            AGENT_A="$BASELINE"
            AGENT_B="$CANDIDATE"
            SEED=202608240402
          fi
          OUT="raw/${ORIENTATION}-${PAIR_START}"
          /usr/bin/time \
            -f 'wall_s=%e user_s=%U sys_s=%S max_rss_kb=%M exit=%x' \
            -o "${OUT}.time" \
            ./bin/arena -a "$AGENT_A" -b "$AGENT_B" \
              -n 100 -t 4 -s "$SEED" -r 3 --pair-start "$PAIR_START" \
              --raw-pairs "${OUT}.jsonl" --raw-only \
              --provenance "$FINAL_PROVENANCE"
          sha256sum "${OUT}.jsonl" > "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: continuation-soup-v1-final-${{ matrix.orientation }}-${{ matrix.start }}
          path: raw
          if-no-files-found: error
          retention-days: 30

  final_merge:
    needs: final_evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      passed: ${{ steps.decision.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: continuation-soup-v1-final-*
          path: downloads
          merge-multiple: true

      - name: Validate every final shard before any efficacy merge
        run: |
          set -euo pipefail
          test "$(sha256sum tools/merge_arena.py | cut -d' ' -f1)" = "$MERGER_SHA"
          test "$(sha256sum tools/gate_actor_panel.py | cut -d' ' -f1)" = "$GATE_SHA"
          test "$(sha256sum tools/validate_actor_shards.py | cut -d' ' -f1)" = "$SHARD_VALIDATOR_SHA"
          mkdir -p merged
          python3 tools/validate_actor_shards.py \
            --directory downloads --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --provenance "$FINAL_PROVENANCE" \
            --candidate-first-seed 202608240401 \
            --baseline-first-seed 202608240402 \
            --starts 0,100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400,1500,1600,1700,1800,1900,2000,2100,2200,2300,2400 \
            --pairs-per-shard 100 --rounds 3 \
            --output merged/structural-validation.json
          python3 tools/merge_arena.py block \
            --expect-start 0 --expect-pairs 2500 \
            --output merged/candidate-first.json \
            downloads/candidate-first-*.jsonl
          python3 tools/merge_arena.py block \
            --expect-start 0 --expect-pairs 2500 \
            --output merged/baseline-first.json \
            downloads/baseline-first-*.jsonl
          python3 tools/merge_arena.py reciprocal \
            --first merged/candidate-first.json \
            --second merged/baseline-first.json \
            --gate-z 1.645 --require-positive-margin \
            --output merged/reciprocal.json

      - name: Apply both locked one-sided final bounds
        id: decision
        run: |
          set -euo pipefail
          python3 tools/gate_actor_panel.py \
            --reciprocal merged/reciprocal.json --mode final \
            --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --provenance "$FINAL_PROVENANCE" \
            --pairs-per-orientation 2500 \
            --candidate-first-seed 202608240401 \
            --baseline-first-seed 202608240402 \
            --gate-z 1.645 --output merged/final-decision.json \
            --github-output "$GITHUB_OUTPUT"
          find downloads merged -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
            xargs -0 sha256sum > merged/SHA256SUMS.txt
          sha256sum -c merged/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: continuation-soup-v1-promotion-final-evidence
          path: |
            downloads
            merged
          if-no-files-found: error
          retention-days: 30
