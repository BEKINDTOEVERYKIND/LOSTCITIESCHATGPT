name: Policy-cost v3 definition validation

# This workflow validates only the inert recovery definition.  The unique
# execution addendum is deliberately absent from this path filter so its push
# can trigger only the separately locked campaign workflow.
on:
  push:
    branches: [agent/correctness-and-policy-upgrade]
    paths:
      - POLICY_COST_V3.md
      - .github/workflows/policy-cost-v3-definition.yml
      - .github/workflows/policy-cost-v3.yml
      - data/experiments/locked_policy_cost_v3_plan.json
      - data/experiments/locked_policy_cost_v3_execution.template.json
      - data/experiments/locked_policy_cost_v3_pre_efficacy_manifest.template.json
      - data/experiments/policy_cost_v2_infrastructure_retain.json
      - data/experiments/policy_cost_v2_run_33095561493_failure.json
      - data/experiments/policy_cost_v3_exact17_exclusions.txt
      - data/experiments/policy_cost_v3_exact17_exclusions.json
      - data/experiments/policy_cost_v3_python_requirements.txt
      - src/policy_cost_v3.c
      - src/policy_cost_v3.h
      - tools/policy_cost_allocate_v3.py
      - tools/policy_cost_artifact_v3.py
      - tools/policy_cost_calibration_v3.py
      - tools/policy_cost_campaign_v3.py
      - tools/policy_cost_dataset_v3.c
      - tools/policy_cost_exact17_v3.py
      - tools/policy_cost_selection_v3.py
      - tests/test_policy_cost_exact17_v3.py
      - tests/test_policy_cost_v3.c
      - tests/test_policy_cost_v3_recovery.py
  pull_request:
    paths:
      - POLICY_COST_V3.md
      - .github/workflows/policy-cost-v3-definition.yml
      - .github/workflows/policy-cost-v3.yml
      - data/experiments/locked_policy_cost_v3_plan.json
      - data/experiments/locked_policy_cost_v3_execution.template.json
      - data/experiments/locked_policy_cost_v3_pre_efficacy_manifest.template.json
      - data/experiments/policy_cost_v2_infrastructure_retain.json
      - data/experiments/policy_cost_v2_run_33095561493_failure.json
      - data/experiments/policy_cost_v3_exact17_exclusions.txt
      - data/experiments/policy_cost_v3_exact17_exclusions.json
      - data/experiments/policy_cost_v3_python_requirements.txt
      - src/policy_cost_v3.c
      - src/policy_cost_v3.h
      - tools/policy_cost_allocate_v3.py
      - tools/policy_cost_artifact_v3.py
      - tools/policy_cost_calibration_v3.py
      - tools/policy_cost_campaign_v3.py
      - tools/policy_cost_dataset_v3.c
      - tools/policy_cost_exact17_v3.py
      - tools/policy_cost_selection_v3.py
      - tests/test_policy_cost_exact17_v3.py
      - tests/test_policy_cost_v3.c
      - tests/test_policy_cost_v3_recovery.py

permissions:
  contents: read

env:
  MKL_NUM_THREADS: '1'
  NPY_DISABLE_CPU_FEATURES: AVX512F
  OMP_NUM_THREADS: '1'
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  CFLAGS_LOCKED: -O3 -march=x86-64-v3 -ffast-math -funroll-loops -Wall -Wextra -std=c11
  LDFLAGS_LOCKED: -lm -pthread
  REQUIREMENTS: data/experiments/policy_cost_v3_python_requirements.txt

jobs:
  validate-definition:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, path: campaign}
      - name: Materialize the exact frozen Python runtime
        run: |
          set -euo pipefail
          test "$(python3 --version 2>&1)" = "Python 3.12.3"
          mkdir python-wheel python-runtime
          python3 -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --require-hashes --dest python-wheel \
            -r "campaign/$REQUIREMENTS"
          test "$(find python-wheel -maxdepth 1 -type f -name '*.whl' | wc -l)" = 2
          NUMPY_WHEEL="python-wheel/numpy-2.3.5-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl"
          PYYAML_WHEEL="python-wheel/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
          test "$(sha256sum "$NUMPY_WHEEL" | cut -d' ' -f1)" = \
            0d8163f43acde9a73c2a33605353a4f1bc4798745a8b1d73183b28e5b435ae28
          test "$(sha256sum "$PYYAML_WHEEL" | cut -d' ' -f1)" = \
            ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          python3 -m pip install --disable-pip-version-check --no-index \
            --no-deps --target python-runtime "$NUMPY_WHEEL" "$PYYAML_WHEEL"
          PYTHONPATH="$PWD/python-runtime" python3 -c \
            'import numpy, yaml; assert numpy.__version__ == "2.3.5"; assert yaml.__version__ == "6.0.3"'
      - name: Compile the exact versioned native runtime and reproduce exact17
        run: |
          set -euo pipefail
          test "$(gcc -dumpfullversion -dumpversion)" = 13.3.0
          test ! -e campaign/data/experiments/locked_policy_cost_v3_execution.json
          mkdir source
          git -C campaign archive HEAD | tar -x -C source
          cd source
          cp src/policy_cost_v3.c src/policy_cost.c
          cp src/policy_cost_v3.h src/policy_cost.h
          make -j2 CC=gcc CFLAGS="$CFLAGS_LOCKED" LDFLAGS="$LDFLAGS_LOCKED" \
            bin/arena bin/build_policy_cost bin/test_policy_cost
          gcc $CFLAGS_LOCKED -o bin/policy_cost_dataset \
            tools/policy_cost_dataset_v3.c src/lc.c src/features.c src/net.c \
            src/heuristic.c src/planner.c src/search.c src/rollout.c \
            src/late_resolver.c src/match_value.c src/policy_cost.c \
            src/agent.c src/match.c src/spec.c $LDFLAGS_LOCKED
          gcc $CFLAGS_LOCKED -fno-fast-math -ffp-contract=off \
            -o bin/test_policy_cost_v3 \
            tests/test_policy_cost_v3.c src/lc.c src/features.c src/net.c \
            src/heuristic.c src/planner.c src/search.c src/rollout.c \
            src/late_resolver.c src/match_value.c src/policy_cost.c \
            src/agent.c src/match.c src/spec.c $LDFLAGS_LOCKED
          bin/test_policy_cost
          bin/test_policy_cost_v3
          bin/policy_cost_dataset self-test
          EXACT17_TMP="$(mktemp -d)"
          python3 tools/policy_cost_exact17_v3.py export --root . \
            --hash-probe bin/policy_cost_dataset \
            --text-out "$EXACT17_TMP/policy_cost_v3_exact17_exclusions.txt" \
            --json-out "$EXACT17_TMP/policy_cost_v3_exact17_exclusions.json"
          cmp "$EXACT17_TMP/policy_cost_v3_exact17_exclusions.txt" \
            data/experiments/policy_cost_v3_exact17_exclusions.txt
          cmp "$EXACT17_TMP/policy_cost_v3_exact17_exclusions.json" \
            data/experiments/policy_cost_v3_exact17_exclusions.json
      - name: Validate the complete definition with the isolated runtime
        working-directory: campaign
        run: |
          set -euo pipefail
          RUNTIME="$GITHUB_WORKSPACE/python-runtime"
          PYTHONPATH="$RUNTIME" python3 -c \
            'import numpy, yaml; assert numpy.__version__ == "2.3.5"; assert yaml.__version__ == "6.0.3"'
          test ! -e data/experiments/locked_policy_cost_v3_execution.json
          PYTHONPATH="$RUNTIME" python3 tools/policy_cost_campaign_v3.py validate-plan --root .
          PYTHONPATH="$RUNTIME" make test CC=gcc \
            CFLAGS="$CFLAGS_LOCKED" LDFLAGS="$LDFLAGS_LOCKED"
          PYTHONPATH="$RUNTIME" python3 -m unittest discover -s tests -p 'test_*.py'
          PYTHONPATH="$RUNTIME" python3 - <<'PY'
          import pathlib, yaml
          for path in (
              pathlib.Path('.github/workflows/policy-cost-v3.yml'),
              pathlib.Path('.github/workflows/policy-cost-v3-definition.yml'),
          ):
              value = yaml.safe_load(path.read_text(encoding='utf-8'))
              assert isinstance(value, dict) and isinstance(value.get('jobs'), dict)
          PY
