          set -euo pipefail; (cd transport && sha256sum -c SHA256SUMS); (cd calibration-upstream && sha256sum -c SHA256SUMS); (cd freeze && sha256sum -c reservoir-freeze.json.sha256); cp -a calibration-upstream/. transport/; cp freeze/reservoir-freeze.json transport/bindings/; cd transport; chmod 0755 bin/arena bin/build_policy_cost bin/policy_cost_dataset; python3 tools/policy_cost_campaign_v3.py verify-reservoir-freeze --manifest bindings/reservoir-freeze.json --root . --split SELECT; GATE_CHECK="$(mktemp -d)/calibration-gate.json"; python3 tools/policy_cost_campaign_v3.py calibration-gate --calibration calibration.json --execution bindings/execution.json --output "$GATE_CHECK"; cmp "$GATE_CHECK" calibration-gate.json; test "$(python3 -c 'import json; print(str(json.load(open("calibration-gate.json"))["calibration_passed"]).lower())')" = true; python3 tools/policy_cost_campaign_v3.py handoff-manifest --stage calibration_to_select --input calibration.json --input calibration-gate.json --input preselect-policy-cost.lcpc --output calibration-handoff-recomputed.json; cmp calibration-handoff-recomputed.json calibration-handoff.json; SUMS="$(mktemp)"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$SUMS"; mv "$SUMS" SHA256SUMS; sha256sum -c SHA256SUMS; test "$GITHUB_RUN_ATTEMPT" = 1; python3 tools/policy_cost_campaign_v3.py verify-runtime --transport .
          test ! -e ../python-runtime; mkdir ../python-runtime
