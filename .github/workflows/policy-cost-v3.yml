      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: policy-cost-v3-selection-handoff, path: selection-handoff, if-no-files-found: error, retention-days: 30}

  test_discover:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: policy-cost-v3-transport, path: transport}
      - run: |
          set -euo pipefail; test "$GITHUB_RUN_ATTEMPT" = 1; cd transport; chmod 0755 bin/arena bin/build_policy_cost bin/policy_cost_dataset; sha256sum -c SHA256SUMS; python3 tools/policy_cost_campaign_v3.py verify-runtime --transport .
          ./bin/policy_cost_dataset discover --out test-discovery.jsonl --reservoir-out test-reservoir.tsv --net data/champion.bin --split TEST --matches 32768 --match-start 0 --reservoir-per-cell 64 --exclusions bindings/exact17/policy_cost_v3_exact17_exclusions.txt --exclusions-sha256 "$(sha256sum bindings/exact17/policy_cost_v3_exact17_exclusions.txt|cut -d' ' -f1)"
          python3 tools/policy_cost_allocate_v3.py --discovery test-discovery.jsonl --discovery-sha256 "$(sha256sum test-discovery.jsonl|cut -d' ' -f1)" --reservoir test-reservoir.tsv --reservoir-sha256 "$(sha256sum test-reservoir.tsv|cut -d' ' -f1)" --out test-allocation.tsv
          ./bin/policy_cost_dataset verify-reservoir --out test-reservoir-proof.json --manifest test-allocation.tsv --manifest-sha256 "$(sha256sum test-allocation.tsv|cut -d' ' -f1)" --reservoir test-reservoir.tsv --reservoir-sha256 "$(sha256sum test-reservoir.tsv|cut -d' ' -f1)" --net data/champion.bin --exclusions bindings/exact17/policy_cost_v3_exact17_exclusions.txt --exclusions-sha256 "$(sha256sum bindings/exact17/policy_cost_v3_exact17_exclusions.txt|cut -d' ' -f1)"
          SUMS="$(mktemp)"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$SUMS"; mv "$SUMS" SHA256SUMS; sha256sum -c SHA256SUMS
