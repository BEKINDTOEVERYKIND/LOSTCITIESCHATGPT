      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: policy-cost-v3-reservoir-freeze, path: freeze}
      - run: |
          set -euo pipefail; (cd transport && sha256sum -c SHA256SUMS); (cd calibration-upstream && sha256sum -c SHA256SUMS); (cd freeze && sha256sum -c reservoir-freeze.json.sha256); cp calibration-upstream/{calibration.json,calibration-gate.json,preselect-policy-cost.lcpc,calibration-handoff.json} transport/; cp freeze/reservoir-freeze.json transport/bindings/; cd transport; chmod 0755 bin/arena bin/build_policy_cost bin/policy_cost_dataset; python3 tools/policy_cost_campaign_v3.py verify-reservoir-freeze --manifest bindings/reservoir-freeze.json --root . --split SELECT; GATE_CHECK="$(mktemp -d)/calibration-gate.json"; python3 tools/policy_cost_campaign_v3.py calibration-gate --calibration calibration.json --execution bindings/execution.json --output "$GATE_CHECK"; cmp "$GATE_CHECK" calibration-gate.json; test "$(python3 -c 'import json; print(str(json.load(open("calibration-gate.json"))["calibration_passed"]).lower())')" = true; python3 tools/policy_cost_campaign_v3.py handoff-manifest --stage calibration_to_select --input calibration.json --input calibration-gate.json --input preselect-policy-cost.lcpc --output calibration-handoff-recomputed.json; cmp calibration-handoff-recomputed.json calibration-handoff.json; SUMS="$(mktemp)"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$SUMS"; mv "$SUMS" SHA256SUMS; sha256sum -c SHA256SUMS; test "$GITHUB_RUN_ATTEMPT" = 1; python3 tools/policy_cost_campaign_v3.py verify-runtime --transport .
          START=$(( ${{ matrix.slice }} * 48 )); mkdir -p select-slices
          ./bin/policy_cost_dataset evaluate --out "select-slices/${{ matrix.slice }}.jsonl" --manifest select-allocation.tsv --manifest-sha256 "$(sha256sum select-allocation.tsv|cut -d' ' -f1)" --reservoir select-reservoir.tsv --reservoir-sha256 "$(sha256sum select-reservoir.tsv|cut -d' ' -f1)" --actor "$(python3 -c 'import json; print(json.load(open("bindings/execution.json"))["subject"]["neutral_counterfactual_actor"])')" --truth-net data/champion.bin --policy-cost preselect-policy-cost.lcpc --maintained-actor "$(python3 -c 'import json; print(json.load(open("bindings/execution.json"))["subject"]["maintained_actor"])')" --allocation-start "$START" --allocation-count 48
          sha256sum "select-slices/${{ matrix.slice }}.jsonl" | cut -d' ' -f1 > "select-slices/${{ matrix.slice }}.jsonl.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: policy-cost-v3-select-eval-${{ matrix.slice }}
          path: transport/select-slices
