          NUMPY_WHEEL='bindings/runtime/numpy-2.3.5-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl'
          PYYAML_WHEEL='bindings/runtime/pyyaml-6.0.3-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl'
          python3 -m pip install --disable-pip-version-check --no-index --no-deps --target ../python-runtime "$NUMPY_WHEEL" "$PYYAML_WHEEL"
          export PYTHONPATH="$PWD/../python-runtime"
          python3 -c 'import numpy, yaml; assert numpy.__version__ == "2.3.5"; assert yaml.__version__ == "6.0.3"'
          mapfile -t SLICES < <(find ../shards -type f -name '*.jsonl' -print | sort -V); test "${#SLICES[@]}" = 192
          mkdir -p evidence/select/raw
          for SLICE_PATH in "${SLICES[@]}"; do SIDE="$SLICE_PATH.sha256"; test -f "$SIDE"; WANT="$(tr -d '\r\n' < "$SIDE")"; test "${#WANT}" = 64; test "$(sha256sum "$SLICE_PATH" | cut -d' ' -f1)" = "$WANT"; cp "$SLICE_PATH" "$SIDE" evidence/select/raw/; done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence/select/raw'); files=[]
          for path in sorted(root.glob('*.jsonl'), key=lambda item: int(item.stem)):
              files.append({'path':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'size':path.stat().st_size})
          Path('evidence/select/raw-shards.json').write_text(json.dumps({'schema':'lc-policy-cost-v3-raw-evaluation-manifest-v1','stage':'SELECT','files':files},indent=2,sort_keys=True,ensure_ascii=True,allow_nan=False)+'\n',encoding='ascii')
          PY
          ARGS=(); for SLICE_PATH in "${SLICES[@]}"; do ARGS+=(--input "$SLICE_PATH"); done
          python3 tools/policy_cost_campaign_v3.py merge-evaluation-slices --stage SELECT "${ARGS[@]}" --output select-evaluation.jsonl
          python3 tools/policy_cost_campaign_v3.py holdout-input --evaluation select-evaluation.jsonl --allocation select-allocation.tsv --stage SELECT --execution bindings/execution.json --calibration calibration.json --policy-cost preselect-policy-cost.lcpc --output select-input.json
          python3 tools/policy_cost_selection_v3.py select --input select-input.json --output select-result.json
          SELECT_FLOOR="$(python3 -c 'import json; print(json.load(open("select-result.json"))["selected"]["policy_floor"])')"; SELECT_PLY="$(python3 -c 'import json; print(json.load(open("select-result.json"))["selected"]["ply_lo"])')"
          BETAS="$(python3 -c 'import json; print(",".join(map(str,json.load(open("calibration.json"))["schedule"]["beta_search"])))')"; ALPHAS_A="$(python3 -c 'import json; print(",".join(map(str,json.load(open("calibration.json"))["schedule"]["alpha_core"])))')"; ALPHAS_D="$(python3 -c 'import json; print(",".join(map(str,json.load(open("calibration.json"))["schedule"]["alpha_draw"])))')"; MATCH_VALUE_ARG="$(python3 -c 'import json; p=json.load(open("bindings/execution.json"))["subject"].get("match_value_path"); print("--match-value " + p if p else "")')"
          ./bin/build_policy_cost --root-model data/champion.bin --continuation-model data/champion.bin --out policy-cost.lcpc --source-seed 202701140101 --epsilon 0x1p-150 --objective "$(python3 -c 'import json; print(json.load(open("bindings/execution.json"))["subject"]["objective"])')" $MATCH_VALUE_ARG --root-symmetries 20 --playout-symmetries 20 --playout-sample 4 --playout-prune 1 --exact-terminal 1 --no-belief 1 --dets 800 --confirm-dets 800 --root-width 5 --action-core-count 3 --min-cand 1 --ply-lo "$SELECT_PLY" --ply-hi 0 --discard-guard 1 --root-prune 0 --cand-floor "$SELECT_FLOOR" --override-k 3.5 --override-min 0 --beta "$BETAS" --alpha-action "$ALPHAS_A" --alpha-draw "$ALPHAS_D"
