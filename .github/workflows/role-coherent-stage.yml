name: Locked role-coherent continuation test

on:
  workflow_dispatch:
  push:
    branches:
      - agent/correctness-and-policy-upgrade
    paths:
      - .github/workflows/role-coherent-stage.yml
      - data/experiments/locked_role_coherent_execution.json

permissions:
  contents: read

env:
  EVAL_SOURCE: 08f9e1a5218e03c399b257b852efe20b0089c7b0
  PLAN_SHA: 656ac8ca91ecc9b0b4fb901216a2a7fdb85226a3c9a049df2a6e33bfce8024b1
  EXECUTION_SHA: 3d196bc017dd480686874bab4d2afeb2bed1c1fdfac4d9e578b6e37d907ca320
  PARENT_RESULT_SHA: ea9d170a007c95b43a4580ac9235a93ee52cd722feafb5706d9830b357d339e3
  MODEL_SHA: af2b2c237d21f5ec15acbcba2fde3e45864a6e44af4ddb1ff6f3756fd687f417
  CANDIDATE: rolloutu:data/champion.bin:512:5:0.02:0:1:14:0:0:0:0:3.5:2:4:20:0:0:20:1:0:512:1:0:0:0:0:0:0:3:1:0:0:0:0:0:0:1
  BASELINE: rolloutu:data/champion.bin:512:5:0.02:0:1:14:0:0:0:0:3.5:2:2:20:0:0:20:1:0:512:1:0:0:0:0:0:0:2:1:0:0:0:0:0:0:1

jobs:
  build-evaluator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EVAL_SOURCE }}

      - name: Build one portable evaluator artifact
        run: |
          set -euo pipefail
          make CC=gcc \
            CFLAGS='-O3 -march=x86-64-v3 -ffast-math -funroll-loops -Wall -Wextra -std=c11' \
            bin/arena data/champion.bin
          test "$(sha256sum data/champion.bin | cut -d' ' -f1)" = "$MODEL_SHA"
          mkdir -p evaluator
          cp bin/arena evaluator/arena
          cp data/champion.bin evaluator/champion.bin
          {
            echo "source=$EVAL_SOURCE"
            echo "cflags=-O3 -march=x86-64-v3 -ffast-math -funroll-loops -Wall -Wextra -std=c11"
            gcc --version | head -1
            sha256sum evaluator/arena evaluator/champion.bin
          } > evaluator/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: role-coherent-evaluator
          path: evaluator
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: build-evaluator
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        orientation: [candidate-first, baseline-first]
        start: [0, 100, 200, 300, 400, 500, 600, 700, 800, 900]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: role-coherent-evaluator
          path: evaluator

      - name: Run locked shard
        env:
          ORIENTATION: ${{ matrix.orientation }}
          PAIR_START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          mkdir -p bin data raw
          cp evaluator/arena bin/arena
          cp evaluator/champion.bin data/champion.bin
          chmod +x bin/arena
          test "$(sha256sum data/champion.bin | cut -d' ' -f1)" = "$MODEL_SHA"
          ARENA_SHA="$(sha256sum bin/arena | cut -d' ' -f1)"
          if [ "$ORIENTATION" = candidate-first ]; then
            AGENT_A="$CANDIDATE"
            AGENT_B="$BASELINE"
            SEED=202608181301
          else
            AGENT_A="$BASELINE"
            AGENT_B="$CANDIDATE"
            SEED=202608181302
          fi
          PROVENANCE="plan=$PLAN_SHA;execution=$EXECUTION_SHA;parent_result=$PARENT_RESULT_SHA;source=$EVAL_SOURCE;arena=$ARENA_SHA;model=$MODEL_SHA;threads=4"
          OUT="raw/${ORIENTATION}-${PAIR_START}"
          /usr/bin/time \
            -f 'wall_s=%e user_s=%U sys_s=%S max_rss_kb=%M exit=%x' \
            -o "${OUT}.time" \
            ./bin/arena -a "$AGENT_A" -b "$AGENT_B" \
              -n 100 -t 4 -s "$SEED" -r 3 \
              --pair-start "$PAIR_START" \
              --raw-pairs "${OUT}.jsonl" --raw-only \
              --provenance "$PROVENANCE"
          sha256sum "${OUT}.jsonl" > "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: role-coherent-raw-${{ matrix.orientation }}-${{ matrix.start }}
          path: raw
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: role-coherent-raw-*
          path: downloads
          merge-multiple: true

      - name: Validate sidecars and merge exact pair rows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import os
          import re

          expected_shared = {
              "plan": os.environ["PLAN_SHA"],
              "execution": os.environ["EXECUTION_SHA"],
              "parent_result": os.environ["PARENT_RESULT_SHA"],
              "source": os.environ["EVAL_SOURCE"],
              "model": os.environ["MODEL_SHA"],
              "threads": "4",
          }
          arenas = set()
          for path in sorted(glob.glob("downloads/*.jsonl")):
              with open(path, encoding="utf-8") as handle:
                  meta = json.loads(handle.readline())
              name = os.path.basename(path)
              match = re.fullmatch(
                  r"(candidate-first|baseline-first)-(\d+)\.jsonl", name)
              if match is None:
                  raise SystemExit(f"unexpected shard name: {name}")
              orientation, start = match.groups()
              expected_a, expected_b, expected_seed = (
                  (os.environ["CANDIDATE"], os.environ["BASELINE"], "202608181301")
                  if orientation == "candidate-first"
                  else (os.environ["BASELINE"], os.environ["CANDIDATE"], "202608181302")
              )
              required_meta = {
                  "record": "meta",
                  "schema": 1,
                  "seed": expected_seed,
                  "pair_start": start,
                  "pair_count": 100,
                  "rounds": 3,
                  "agent_a": expected_a,
                  "agent_b": expected_b,
              }
              for key, value in required_meta.items():
                  if meta.get(key) != value:
                      raise SystemExit(
                          f"{name}: {key}={meta.get(key)!r}, expected {value!r}")
              parts = dict(item.split("=", 1)
                           for item in meta["provenance"].split(";"))
              arena = parts.pop("arena", "")
              if not re.fullmatch(r"[0-9a-f]{64}", arena):
                  raise SystemExit(f"{name}: invalid arena digest")
              if parts != expected_shared:
                  raise SystemExit(f"{name}: provenance mismatch: {parts!r}")
              arenas.add(arena)
          if len(arenas) != 1:
              raise SystemExit(f"evaluator drift across shards: {sorted(arenas)!r}")
          PY
          for sidecar in downloads/*.sha256; do
            expected="$(cut -d' ' -f1 "$sidecar")"
            payload="${sidecar%.sha256}.jsonl"
            test "$(sha256sum "$payload" | cut -d' ' -f1)" = "$expected"
          done
          mkdir -p merged
          python3 tools/merge_arena.py block \
            --expect-start 0 --expect-pairs 1000 \
            --output merged/candidate-first.json \
            downloads/candidate-first-*.jsonl
          python3 tools/merge_arena.py block \
            --expect-start 0 --expect-pairs 1000 \
            --output merged/baseline-first.json \
            downloads/baseline-first-*.jsonl
          python3 tools/merge_arena.py reciprocal \
            --first merged/candidate-first.json \
            --second merged/baseline-first.json \
            --gate-z 1.645 --require-positive-margin \
            --output merged/reciprocal.json
          find downloads merged -type f ! -name SHA256SUMS.txt -print0 | sort -z | \
            xargs -0 sha256sum > merged/SHA256SUMS.txt
          sha256sum -c merged/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: role-coherent-final-evidence
          path: |
            downloads
            merged
          if-no-files-found: error
          retention-days: 30
