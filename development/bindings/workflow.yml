          PROVENANCE="stage=match_value_objective3_v2_safety;variant=$VARIANT;development=${{ needs.development_select.outputs.decision_sha }};plan=${{ needs.preflight.outputs.plan_sha }};lock=${{ needs.preflight.outputs.definition_lock_sha }};execution=${{ needs.preflight.outputs.execution_sha }};post_build=${{ needs.preflight.outputs.post_build_manifest_sha }};source=${{ needs.preflight.outputs.source_commit }};arena=${{ needs.preflight.outputs.arena_sha }};model=$MODEL_SHA;table=$TABLE_SHA;worlds=${{ needs.preflight.outputs.world_cap }};threads=4"
