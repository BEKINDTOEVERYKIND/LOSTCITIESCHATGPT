        id: gate
        run: |
          set -euo pipefail
          CANDIDATE='${{ needs.development_select.outputs.selected_actor }}'
          BASELINE='${{ needs.preflight.outputs.baseline }}'
          VARIANT='${{ needs.development_select.outputs.selected_variant }}'
          TABLE_SHA="$(python3 - "$VARIANT" <<'PY'
          import json, sys
          key = 'projected' if sys.argv[1] == 'PROJECTED_ALL_PLY' else 'raw'
          print(json.load(open('transport/bindings/table-manifest.json'))[key]['sha256'])
          PY
          )"
          PROVENANCE="stage=match_value_objective3_v2_final;variant=$VARIANT;development=${{ needs.development_select.outputs.decision_sha }};safety=${{ needs.safety_merge.outputs.decision_sha }};plan=${{ needs.preflight.outputs.plan_sha }};lock=${{ needs.preflight.outputs.definition_lock_sha }};execution=${{ needs.preflight.outputs.execution_sha }};post_build=${{ needs.preflight.outputs.post_build_manifest_sha }};source=${{ needs.preflight.outputs.source_commit }};arena=${{ needs.preflight.outputs.arena_sha }};model=$MODEL_SHA;table=$TABLE_SHA;worlds=${{ needs.preflight.outputs.world_cap }};threads=4"
          python3 transport/tools/match_value_objective3_v2.py gate-final \
            --reciprocal merged/reciprocal.json \
            --candidate "$CANDIDATE" --baseline "$BASELINE" \
            --provenance "$PROVENANCE" \
            --candidate-first-seed "$FINAL_CANDIDATE_SEED" \
            --baseline-first-seed "$FINAL_BASELINE_SEED" \
            --output merged/final-decision.json \
            --github-output "$GITHUB_OUTPUT"
          cp safety/merged/safety-decision.json bindings/
          cp safety/bindings/development-selection.json bindings/
          cp -a transport/bindings/. bindings/
          find downloads merged bindings -type f ! -name SHA256SUMS.txt -print0 | \
            sort -z | xargs -0 sha256sum > merged/SHA256SUMS.txt
          sha256sum -c merged/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-value-objective3-v2-final-complete-evidence
          path: |
            downloads
            merged
            bindings
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  terminal_no_challenge:
    if: ${{ github.run_attempt == 1 && needs.preflight.result == 'success' && needs.development_select.result == 'success' && needs.development_select.outputs.eligible == 'false' }}
    needs: [preflight, development_select]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-transport
          path: evidence/transport
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-development-complete-evidence
          path: evidence/development
      - name: Produce the no-candidate terminal disposition
        run: |
          set -euo pipefail
          mkdir -p evidence/stages
          cp evidence/transport/bindings/pre-efficacy-manifest.json \
            evidence/pre-efficacy-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence")
          selection = json.loads((
              root / "development/merged/development-selection.json"
          ).read_text())
          if selection.get('challenge_exists') is not False:
              raise SystemExit('terminal path does not match selection')
          for stage, reason in (
              ("safety", "no eligible development challenger"),
              ("final", "no eligible development challenger"),
          ):
              value = {
                  "schema": "lc-match-value-objective3-v2-skipped-stage-v1",
                  "stage": stage,
                  "status": "not_run",
                  "reason": reason,
              }
              (root / f"stages/{stage}-skipped.json").write_text(
                  json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
          python3 evidence/transport/tools/match_value_objective3_v2.py \
            terminal-result \
            --execution evidence/transport/bindings/execution.json \
            --development evidence/development/merged/development-selection.json \
            --evidence-root evidence --output evidence/result.json
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd evidence && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-value-objective3-v2-complete-evidence
          path: evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  terminal_safety_rejected:
    if: ${{ github.run_attempt == 1 && needs.preflight.result == 'success' && needs.development_select.result == 'success' && needs.development_select.outputs.eligible == 'true' && needs.safety_merge.result == 'success' && needs.safety_merge.outputs.passed == 'false' }}
    needs: [preflight, development_select, safety_merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-transport
          path: evidence/transport
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-development-complete-evidence
          path: evidence/development
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-safety-complete-evidence
          path: evidence/safety
      - name: Produce the safety-rejected terminal disposition
        run: |
          set -euo pipefail
          mkdir -p evidence/stages
          cp evidence/transport/bindings/pre-efficacy-manifest.json \
            evidence/pre-efficacy-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence")
          selection = json.loads((
              root / "development/merged/development-selection.json"
          ).read_text())
          safety = json.loads((
              root / "safety/merged/safety-decision.json"
          ).read_text())
          if selection.get('challenge_exists') is not True or safety.get('passed') is not False:
              raise SystemExit('terminal path does not match safety decision')
          value = {
              "schema": "lc-match-value-objective3-v2-skipped-stage-v1",
              "stage": "final",
              "status": "not_run",
              "reason": "locked safety gate failed",
          }
          (root / "stages/final-skipped.json").write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
          python3 evidence/transport/tools/match_value_objective3_v2.py \
            terminal-result \
            --execution evidence/transport/bindings/execution.json \
            --development evidence/development/merged/development-selection.json \
            --safety evidence/safety/merged/safety-decision.json \
            --evidence-root evidence --output evidence/result.json
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd evidence && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-value-objective3-v2-complete-evidence
          path: evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  terminal_final_disposition:
    if: ${{ github.run_attempt == 1 && needs.preflight.result == 'success' && needs.development_select.result == 'success' && needs.development_select.outputs.eligible == 'true' && needs.safety_merge.result == 'success' && needs.safety_merge.outputs.passed == 'true' && needs.final_merge.result == 'success' }}
    needs: [preflight, development_select, safety_merge, final_merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-transport
          path: evidence/transport
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-development-complete-evidence
          path: evidence/development
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-safety-complete-evidence
          path: evidence/safety
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: match-value-objective3-v2-final-complete-evidence
          path: evidence/final
      - name: Produce the reserved-final terminal disposition
        run: |
          set -euo pipefail
          cp evidence/transport/bindings/pre-efficacy-manifest.json \
            evidence/pre-efficacy-manifest.json
          python3 evidence/transport/tools/match_value_objective3_v2.py \
            terminal-result \
            --execution evidence/transport/bindings/execution.json \
            --development evidence/development/merged/development-selection.json \
            --safety evidence/safety/merged/safety-decision.json \
            --final evidence/final/merged/final-decision.json \
            --evidence-root evidence --output evidence/result.json
          (cd evidence && find . -type f ! -name SHA256SUMS.txt -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd evidence && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-value-objective3-v2-complete-evidence
          path: evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
