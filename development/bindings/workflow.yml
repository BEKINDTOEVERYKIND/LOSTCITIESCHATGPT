            PROVENANCE="stage=match_value_objective3_v2_development;variant=$VARIANT;plan=${{ needs.preflight.outputs.plan_sha }};lock=${{ needs.preflight.outputs.definition_lock_sha }};execution=${{ needs.preflight.outputs.execution_sha }};post_build=${{ needs.preflight.outputs.post_build_manifest_sha }};source=${{ needs.preflight.outputs.source_commit }};arena=${{ needs.preflight.outputs.arena_sha }};model=$MODEL_SHA;table=$TABLE_SHA;worlds=${{ needs.preflight.outputs.world_cap }};threads=4"
            python3 transport/tools/validate_actor_shards.py \
              --directory "panels/$VARIANT" --candidate "$CANDIDATE" \
              --baseline "$BASELINE" --provenance "$PROVENANCE" \
              --candidate-first-seed "$DEVELOPMENT_CANDIDATE_SEED" \
              --baseline-first-seed "$DEVELOPMENT_BASELINE_SEED" \
              --starts 0,100,200,300,400,500,600,700,800,900 \
              --pairs-per-shard 100 --rounds 3 \
              --output "merged/$VARIANT-structural-validation.json"
          done

      - name: Merge both full panels then select once by the locked rule
        id: select
        run: |
          set -euo pipefail
          ARGS=()
          for VARIANT in RAW_ALL_PLY PROJECTED_ALL_PLY; do
            CANDIDATE="$(python3 - "$VARIANT" <<'PY'
          import json, sys
          print(json.load(open('transport/bindings/actors.json'))['actors'][sys.argv[1]])
          PY
            )"
            TABLE_SHA="$(python3 - "$VARIANT" <<'PY'
          import json, sys
          key = 'projected' if sys.argv[1] == 'PROJECTED_ALL_PLY' else 'raw'
          print(json.load(open('transport/bindings/table-manifest.json'))[key]['sha256'])
          PY
            )"
            PROVENANCE="stage=match_value_objective3_v2_development;variant=$VARIANT;plan=${{ needs.preflight.outputs.plan_sha }};lock=${{ needs.preflight.outputs.definition_lock_sha }};execution=${{ needs.preflight.outputs.execution_sha }};post_build=${{ needs.preflight.outputs.post_build_manifest_sha }};source=${{ needs.preflight.outputs.source_commit }};arena=${{ needs.preflight.outputs.arena_sha }};model=$MODEL_SHA;table=$TABLE_SHA;worlds=${{ needs.preflight.outputs.world_cap }};threads=4"
            python3 transport/tools/merge_arena.py block \
              --expect-start 0 --expect-pairs 1000 \
              --output "merged/$VARIANT-candidate-first.json" \
              panels/$VARIANT/candidate-first-*.jsonl
            python3 transport/tools/merge_arena.py block \
              --expect-start 0 --expect-pairs 1000 \
              --output "merged/$VARIANT-baseline-first.json" \
              panels/$VARIANT/baseline-first-*.jsonl
            python3 transport/tools/merge_arena.py reciprocal \
              --first "merged/$VARIANT-candidate-first.json" \
              --second "merged/$VARIANT-baseline-first.json" \
              --gate-z 1.645 --require-positive-margin \
              --output "merged/$VARIANT-reciprocal.json"
